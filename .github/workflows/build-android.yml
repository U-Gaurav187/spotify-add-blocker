name: Build Android APK & GitHub Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android-app/**'
      - 'page_hook.js'
      - 'styles.css'
      - 'rules.json'
      - 'remote-config.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Spotify Web Controller APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x android-app/gradlew

      - name: Build Android Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find android-app/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotify-web-controller-debug
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: "v3.1.0-android"
          name: "Spotify Web Controller Android App v3.1.0 (with OTA GitHub Sync)"
          body: |
            ### 📱 Spotify Web Controller for Android (v3.1.0)
            
            This release bundles the full Spotify Web Player with:
            - **Over-The-Air (OTA) Remote Updates**: Whenever you push changes to `page_hook.js`, `styles.css`, `rules.json`, or `remote-config.json` on GitHub, the app updates itself automatically in the background.
            - **60fps Native Queue Drag-and-Drop (`=`)**: Full mobile touchscreen support.
            - **Smart Audio Ad Silencing & Fast-Forwarding**.
            - **Unlocked Transport Controls & Seek-Bar Scrubbing**.
            - **Background Audio Playback**: Screen-off playback support via Foreground Service and AudioWebView.
            
            #### 📥 Download & Install
            Download the `app-debug.apk` asset below and install it directly on your Android device (enable "Install unknown apps" in Settings).
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
